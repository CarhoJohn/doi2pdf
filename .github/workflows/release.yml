name: Release

on:
  push:
    tags:
      - v**

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  create-release:
    uses: zotero-plugin-dev/workflows/.github/workflows/release-plugin.yml@main
    # You can customize any of the inputs here.
    # If you omit an input, its default value will be used.
    with:
      build: "npm run build"
      # Scaffold hardcodes the release title; use the version tag after publishing.
      release: |
        npm run release
        gh release edit "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"
    secrets: inherit
